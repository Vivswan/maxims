---
# This repository's OWN settings overlay, written once and repo-owned: edit this file, never the rendered .github/settings.yml (the next sync replaces it and holds the PR).
# Fleet defaults merge UNDER it and the fleet invariants (squash-only merging, the protection rulesets) ABOVE it (Vivswan/repo-platform's docs/settings.md).
#
#   a key declared here   -> wins over the fleet default; null opts out
#   labels (a list)       -> replace the fleet entry by name; undeclared labels are deleted by the apply
#   rulesets (a list)     -> merge into the fleet entry by name; undeclared rulesets are deleted by the apply

repository:
  description: "One-line rule memories installed from GitHub repos into coding agents, guaranteed to load every session"
  # Declared even when empty: the apply manages only declared keys, so
  # this keeps topics healing out-of-band edits.
  topics: ""
  private: false

# This repository's own labels (the fleet layers already carry the
# dependabot, release, and tracking labels its modules need). One label per
# nightly category, matching the tuple each report job in nightly.yml files
# its issue with; nothing gates a release on them.
labels:
  - name: nightly-property-deep
    color: "D93F0B"
    description: The deep property run failed
  - name: nightly-parity-drift
    color: "D93F0B"
    description: npx skills --help drifted from the parity fixture
  - name: nightly-harness-drift
    color: "D93F0B"
    description: A harness definition's verified documentation page changed
  - name: nightly-live-network
    color: "D93F0B"
    description: The live fetch ladder against Vivswan/skills failed
  - name: nightly-latency-trend
    color: "D93F0B"
    description: Hook-path latency or bundle size regressed against 7 days ago
  - name: nightly-container
    color: "D93F0B"
    description: The hermetic container tier failed

# This repository's own rulesets, or additions to a fleet one (an entry
# named like a fleet ruleset merges into it and adds its rules):
# rulesets:
#   - name: my-ruleset
#     target: branch
#     enforcement: active
