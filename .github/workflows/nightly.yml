# Nightly CI: seeded before the fleet sync, never overwritten by it. One job per category and one
# tracking issue per category (repo-platform's docs/nightly.md and docs/fuzzer.md): a red category
# writes its evidence to a failure report, uploads it, and its report leg files or refreshes the
# issue carrying that category's label; a green category closes it. Every category job is
# unconditional, so no report leg ever sees its category as skipped.
#
#   scripts/nightly.ts <category>      -> runs the category, writes the step summary and the report
#   $RUNNER_TEMP/nightly-report/       -> <category>/report.md, the failure-report contract v1
#   report (<category>)                -> fuzz-issue report on failure or cancellation, resolve on success
#
# The tiers a release must pass (property-deep, parity-drift, harness-drift, container) are defined
# once in release-gate.yml, which the managed ci.yml also runs on the release PR; the nightly calls
# it and reads one output per tier, because `needs` reports a called workflow as one result for all its jobs.
#
# A CANCELLED job counts as red: hitting the timeout cancels rather than fails, and a hang is
# exactly what a nightly exists to catch.
name: Nightly

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly

permissions: {}

jobs:
  # The called jobs narrow themselves to contents: read, and a call under this file's empty block
  # would be rejected for asking more than its caller holds.
  release-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/release-gate.yml

  # The built bundle driven through the fetch ladder against Vivswan/skills on the public network.
  live-network:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run nightly live-network --report-dir "$RUNNER_TEMP/nightly-report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: nightly-live-network
          path: ${{ runner.temp }}/nightly-report
          if-no-files-found: ignore

  # HEAD built and timed for the record, then judged against the entry recorded a week ago by
  # rebuilding that entry's sha and timing both bundles on this runner. The trend lives in
  # trend.json on the orphan `benchmarks` branch, checked out into a scratch clone under
  # $RUNNER_TEMP so the measured checkout stays clean; the push goes through the workflow token.
  latency-trend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check out the benchmarks branch into a scratch clone
        env:
          SCRATCH: ${{ runner.temp }}/benchmarks
        # ls-remote exits 2 when the ref does not exist and otherwise on a failed lookup; only the
        # first is a first run, since an orphan created over a live branch could never be pushed.
        run: |
          git init -q "$SCRATCH"
          git -C "$SCRATCH" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          status=0
          git -C "$SCRATCH" ls-remote --exit-code --heads origin benchmarks >/dev/null || status=$?
          case "$status" in
            0)
              git -C "$SCRATCH" fetch -q origin benchmarks
              git -C "$SCRATCH" checkout -q -b benchmarks FETCH_HEAD ;;
            2)
              echo "::notice::no benchmarks branch yet; this run creates it"
              git -C "$SCRATCH" checkout -q --orphan benchmarks ;;
            *)
              echo "::error::could not look up the benchmarks branch (git ls-remote exited $status)"
              exit "$status" ;;
          esac
      - run: bun run nightly latency-trend --trend "$RUNNER_TEMP/benchmarks/trend.json" --report-dir "$RUNNER_TEMP/nightly-report"
      # The entry is recorded whether or not the compare passed, so the trend keeps its history
      # through a red night; a run that never measured leaves nothing to commit, and on a first
      # run there is no file at all yet.
      - name: Commit and push the trend
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SCRATCH: ${{ runner.temp }}/benchmarks
        run: |
          if [ ! -f "$SCRATCH/trend.json" ]; then
            echo "trend.json was never written; nothing to push"
            exit 0
          fi
          git -C "$SCRATCH" add trend.json
          if git -C "$SCRATCH" diff --cached --quiet; then
            echo "trend.json unchanged; nothing to push"
            exit 0
          fi
          git -C "$SCRATCH" config user.name "github-actions[bot]"
          git -C "$SCRATCH" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$SCRATCH" commit -q -m "chore: record nightly latency for ${GITHUB_SHA::7}"
          git -C "$SCRATCH" push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:benchmarks
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: nightly-latency-trend
          path: ${{ runner.temp }}/nightly-report
          if-no-files-found: ignore

  # The published `next` package fetched from the registry by `npx` and driven through one install
  # round trip under a throwaway HOME: the npm artifact itself, not the bundle this checkout builds.
  published-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run nightly published-smoke --report-dir "$RUNNER_TEMP/nightly-report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: nightly-published-smoke
          path: ${{ runner.temp }}/nightly-report
          if-no-files-found: ignore

  # The category jobs stay apart because `needs` reports a matrix job as one result for all its
  # legs, so a matrix of categories could never tell a report leg which one went red. Fail-fast is
  # off so a leg's own failure cannot cancel its siblings' filings.
  #   not `success` -> files: failure, the `cancelled` of a timeout, or a gate output never written
  #   the legs      -> pinned by tests/nightly/workflow_census.test.ts to scripts/nightly.ts and the labels
  report:
    needs: [release-gate, live-network, latency-trend, published-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: property-deep
            result: ${{ needs.release-gate.outputs.property-deep }}
            description: The deep property run failed
          - category: parity-drift
            result: ${{ needs.release-gate.outputs.parity-drift }}
            description: npx skills --help drifted from the parity fixture
          - category: harness-drift
            result: ${{ needs.release-gate.outputs.harness-drift }}
            description: A harness definition's verified source drifted or was unreachable
          - category: live-network
            result: ${{ needs.live-network.result }}
            description: The live fetch ladder against Vivswan/skills failed
          - category: latency-trend
            result: ${{ needs.latency-trend.result }}
            description: Hook-path latency or bundle size regressed against 7 days ago
          - category: published-smoke
            result: ${{ needs.published-smoke.result }}
            description: The published next package failed its smoke run
    steps:
      - if: matrix.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-${{ matrix.category }}
          path: nightly-report
      - if: matrix.result != 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: nightly-${{ matrix.category }}
          title: ${{ matrix.description }}
          label-color: D93F0B
          label-description: ${{ matrix.description }}
          stream: generic
          artifacts-dir: nightly-report
          artifact-name: nightly-${{ matrix.category }}
      - if: matrix.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: nightly-${{ matrix.category }}
          stream: generic

  # No failure report here: the tier's evidence is its log, so the issue points at the run.
  report-container:
    needs: [release-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - if: needs.release-gate.outputs.container != 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: nightly-container
          title: The hermetic container tier failed
          label-color: D93F0B
          label-description: The hermetic container tier failed
          stream: generic
      - if: needs.release-gate.outputs.container == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: nightly-container
          stream: generic
