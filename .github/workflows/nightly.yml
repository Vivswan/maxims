# Nightly CI: seeded before the fleet sync, never overwritten by it. The checks job runs the
# repository's nightly suite; the report job files one label-deduplicated tracking issue on a red
# night and closes it on a green one (repo-platform's docs/nightly.md).
name: Nightly

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Nightly checks
        run: bun run nightly

  # A CANCELLED checks job counts as red: hitting the timeout cancels rather than fails, and a hang
  # is exactly what a nightly exists to catch.
  report:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: File or update the nightly issue
        if: needs.checks.result == 'failure' || needs.checks.result == 'cancelled'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: nightly-failure
          title: Nightly CI failures
          label-color: D93F0B
          label-description: Automated nightly CI failure
          stream: generic

      - name: Close the nightly issue on a green night
        if: needs.checks.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: nightly-failure
          stream: generic
