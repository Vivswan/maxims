# Repo-owned: seeded once by Vivswan/repo-platform, never overwritten by a later sync. The tiers a release must
# pass that need not run on every merge: the real harness CLIs in the hermetic container, the deep property run,
# and the two drift checks against the vendors' docs and the upstream skills CLI. Two callers run the same text:
#
#   nightly.yml       -> every night; its report legs file one issue per tier off the outputs below
#   the managed ci.yml -> the release-please PR and a manual dispatch, inside the all-green gate
#
# One output per tier, because `needs` reports a called workflow as one result for all its jobs and the nightly
# files one issue per tier. A tier that hits its timeout reports `cancelled`, so a caller counts anything but
# `success` as red.

name: Release Gate

on:
  workflow_call:
    outputs:
      property-deep:
        value: ${{ jobs.property-deep.outputs.result }}
      parity-drift:
        value: ${{ jobs.parity-drift.outputs.result }}
      harness-drift:
        value: ${{ jobs.harness-drift.outputs.result }}
      container:
        value: ${{ jobs.container.outputs.result }}

permissions:
  contents: read

jobs:
  # The ordinary suite with a larger property-test iteration count than a pull request pays for.
  property-deep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run nightly property-deep --report-dir "$RUNNER_TEMP/nightly-report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: nightly-property-deep
          path: ${{ runner.temp }}/nightly-report
          if-no-files-found: ignore

  # `npx skills@latest --help` re-captured and diffed against the committed parity fixture.
  parity-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run nightly parity-drift --report-dir "$RUNNER_TEMP/nightly-report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: nightly-parity-drift
          path: ${{ runner.temp }}/nightly-report
          if-no-files-found: ignore

  # Every harness definition's verified source re-fetched and its claims re-matched.
  harness-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run nightly harness-drift --report-dir "$RUNNER_TEMP/nightly-report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: nightly-harness-drift
          path: ${{ runner.temp }}/nightly-report
          if-no-files-found: ignore

  # The hermetic container tier: the script builds the image, runs the suite inside it, probes the
  # sandbox, and writes the build time and image size to the step summary itself. The runtime is
  # required here, so a runner without a daemon fails instead of skipping with a notice.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:container
        env:
          MAXIMS_REQUIRE_CONTAINER_RUNTIME: "1"
