# Repo-owned: seeded before the fleet sync, never overwritten by it. The managed ci.yml calls this
# workflow between release-please cutting the DRAFT release and the attested publish.
#   package      -> build the bundle at the tag and attach it to the draft
#   publish-npm  -> publish the same commit to npm through trusted publishing (OIDC, no token)
#
# Until the owner's one-time npm trusted-publisher setup for this repository exists, publish-npm
# fails and holds the draft; a rerun converges once it does. A version the registry already holds
# is skipped, so reruns never republish.

name: Update Release

on:
  workflow_call:
    inputs:
      tag:
        description: The draft release's tag (forced at creation, so it is checkout-able before publication)
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # also what makes the draft visible to gh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build the bundle
        run: bun run build
      - name: Upload the bundle to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/cli.js --clobber

  # The npm-publish lane serializes publishes; queue: max keeps every queued publish (a lane drops
  # all but one pending job by default).
  publish-npm:
    if: github.repository == 'Vivswan/maxims'
    needs: [package]
    concurrency:
      group: npm-publish
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # registry-url writes the .npmrc npm publishes through; with no NODE_AUTH_TOKEN the action
      # leaves a placeholder there, which npm's OIDC exchange replaces.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (and its provenance) exists from npm 11.5.1 on; an older bundled npm is
      # upgraded once, then held to the floor.
      - name: Require an npm that publishes through OIDC
        run: |
          floor=11.5.1
          below_floor() { [ "$(printf '%s\n' "$floor" "$(npm --version)" | sort -V | head -n1)" != "$floor" ]; }
          if below_floor; then
            npm install -g npm@latest
          fi
          if below_floor; then
            echo "::error::npm $(npm --version) cannot publish through OIDC; trusted publishing needs npm $floor or newer."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - name: Build the bundle
        run: bun run build
      # A version the registry already holds (a rerun) publishes nothing, so a rerun converges.
      - name: Publish the release to npm
        run: |
          version="$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')"
          if npm view "maxims@$version" version >/dev/null 2>&1; then
            echo "::warning::maxims@$version is already on the registry; nothing published."
          else
            npm publish
          fi
