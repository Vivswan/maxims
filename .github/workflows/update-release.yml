# Repo-owned: seeded before the fleet sync, never overwritten by it. The managed ci.yml calls this workflow
# between release-please cutting the DRAFT release and the attested publish, with the tag it forced at creation.
#
#   package      -> resolve the release's source commit from the draft, build the bundle at the tag, attach it to the draft
#   publish-npm  -> the same commit's bundle, published to npm as package.json's X.Y.Z (moving latest) through
#                   trusted publishing (OIDC, no registry token)
#
# Until the owner's one-time npm trusted-publisher setup for Vivswan/maxims exists, publish-npm fails on npm publish
# and holds the draft; a rerun converges once it does. npm validates the CALLING workflow's filename for a
# workflow_call publish, so the trusted publisher for the package maxims names ci.yml, not this file. A version the
# registry already holds is never republished, and once a NEWER release shipped, an older release's rerun leaves
# latest on it.

name: Update Release

on:
  workflow_call:
    inputs:
      tag:
        description: The draft release's tag (forced at creation, so it is checkout-able before publication)
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # also what makes the draft visible to gh
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      # The release's identity is the draft's target commitish, never this run's GITHUB_SHA: the managed head-check
      # lets a newer push's run recover an older merge's pending release.
      - name: Resolve the release's source commit from the draft
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          sha="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
          if ! grep -qxE '[0-9a-f]{40}' <<< "$sha"; then
            echo "::error::draft $TAG's target commitish is '$sha', not a commit SHA; refusing to package an unidentified source."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      # The tag and the draft must name one commit, or the bundle attached here and the one published would be
      # builds of different sources.
      - name: Confirm the tag points at the draft's source
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          tagged="$(git rev-parse "$TAG^{commit}")"
          if [ "$tagged" != "$SOURCE_SHA" ]; then
            echo "::error::tag $TAG points at $tagged, but the draft's target commitish is $SOURCE_SHA; refusing to package two sources as one release."
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build the bundle
        run: bun run build
      - name: Upload the bundle to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/cli.js --clobber

  # The lane is the one post-green.yml's publish-next takes: the registry has no compare-and-set, so the two
  # publishers never overlap and a verdict still holds when its publish lands. package sits in needs for its output
  # (a job reads outputs only from its direct dependencies) and so that nothing reaches the registry before the
  # draft carries its bundle.
  publish-npm:
    if: github.repository == 'Vivswan/maxims'
    needs: [package]
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.source-sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # registry-url writes the .npmrc npm publishes through; with no NODE_AUTH_TOKEN the action leaves a
      # placeholder there, which npm's OIDC exchange replaces.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (and its provenance) exists from npm 11.5.1 on; an older bundled npm is upgraded once,
      # then held to the floor.
      - name: Require an npm that publishes through OIDC
        run: |
          floor=11.5.1
          below_floor() { [ "$(printf '%s\n' "$floor" "$(npm --version)" | sort -V | head -n1)" != "$floor" ]; }
          if below_floor; then
            npm install -g npm@latest
          fi
          if below_floor; then
            echo "::error::npm $(npm --version) cannot publish through OIDC; trusted publishing needs npm $floor or newer."
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - name: Build the bundle
        run: bun run build
      # The verdict holds package.json's version to the tag and reads the registry's origin record, so no release
      # ever displaces a newer one from latest (a pre-release there, the bootstrap's, is taken over); a registry
      # error stops the job instead of publishing blind. GITHUB_SHA on the publish line sets only the SLSA
      # predicate's source digest; the sigstore certificate still carries this run's own head, so a release
      # recovered by a newer push's run has provenance naming two commits.
      - name: Publish the release to npm
        id: publish
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.package.outputs.source-sha }}
        run: |
          verdict="$(GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts npm-verdict stable)"
          case "$verdict" in
            publish\ *)
              GITHUB_SHA="$SOURCE_SHA" npm publish
              echo "confirm=true" >> "$GITHUB_OUTPUT" ;;
            present\ *)
              echo "::notice::${verdict#present } is already on the registry; nothing published, latest is confirmed below."
              echo "confirm=true" >> "$GITHUB_OUTPUT" ;;
            skip\ *) echo "::warning::${verdict#skip }" ;;
            *)
              echo "unexpected npm-verdict output: $verdict"
              echo "::error::npm-verdict printed none of publish, present, or skip; see the line above."
              exit 1 ;;
          esac
      # npm makes a publish readable asynchronously. This step holds the lane until the record shows the version,
      # so the next holder's verdict sees it; a record that never shows it warns. It then fails the job when latest
      # names neither this release nor a newer one: OIDC authenticates npm publish alone, not npm dist-tag add, so
      # no tag is moved here; a hand npm dist-tag add repairs it, and a rerun then confirms and passes.
      - name: Confirm the registry shows the publish and latest names it
        if: steps.publish.outputs.confirm == 'true'
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.package.outputs.source-sha }}
        run: |
          confirmed="$(GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts npm-confirm stable)"
          case "$confirmed" in
            settled\ *) echo "::notice::${confirmed#settled }" ;;
            unsettled\ *) echo "::warning::${confirmed#unsettled }" ;;
            behind\ *)
              echo "::error::${confirmed#behind }"
              exit 1 ;;
            *)
              echo "unexpected npm-confirm output: $confirmed"
              echo "::error::npm-confirm printed neither settled, unsettled, nor behind; see the line above."
              exit 1 ;;
          esac
