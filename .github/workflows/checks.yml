# Repo-owned, never overwritten by sync; the managed ci.yml calls it inside the all-green gate, so every job here
# must pass before all-green goes green.
#   secrets      -> none reach these jobs
#   permissions  -> capped at the caller's contents: read
#   all-green    -> sees only the aggregate result

name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Dead code
        run: bun run knip
