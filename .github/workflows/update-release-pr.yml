# Repo-owned: seeded once by the fleet sync, never
# overwritten by a later sync. Regenerate files that must ride in the
# release commit here; releases never wait on this path. A push made with
# github.token does not re-trigger the PR's checks.

name: Update Release PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: The release PR's number
        required: true
        type: string
      head_branch:
        description: The release PR's head branch (push updates back to it)
        required: true
        type: string

jobs:
  update-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # nothing here writes yet; a regenerating step needs jobs.update-release-pr.permissions.contents: write
    steps:
      - name: Update the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
        # Repository-specific release-PR preparation goes here. A step that regenerates files first checks out
        # `inputs.head_branch` (actions/checkout with ref), with this job's permissions.contents raised to write, e.g.:
        #   ./regenerate-versioned-files.sh
        #   git commit -am "chore: regenerate for release" && git push origin "$HEAD_BRANCH"
        run: echo "nothing to add to release PR $PR_NUMBER yet"
