# Repo-owned. Posts the bench job's report as one sticky PR comment, updated in place on every push.
# It runs here rather than in checks.yml because the CI caller caps checks.yml at contents: read
# and a comment needs pull-requests: write. A workflow_run job runs the default branch's copy of
# this file with a read-write token and never runs the pull request's code: it downloads the
# report the CI run uploaded and posts it as text.
#   which pull request  -> the one the event payload associates with the run; the artifact is the
#                          pull request's own output and names nothing
#   two or none         -> the same head serves two pull requests, or the head came from a fork,
#                          which GitHub associates with no pull request; the job skips with a notice
#                          and the report stays in the CI run's step summary

name: Bench comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Take the one pull request the run is associated with
        id: pr
        env:
          NUMBERS: ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
        run: |
          count=$(jq 'length' <<< "$NUMBERS")
          if [ "$count" != "1" ]; then
            echo "::notice::the run is associated with $count pull requests ($NUMBERS), not one; no comment"
            exit 0
          fi
          echo "number=$(jq 'first' <<< "$NUMBERS")" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-report
          path: ${{ runner.temp }}/bench
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: maxims/bench-comment
          number: ${{ steps.pr.outputs.number }}
          path: ${{ runner.temp }}/bench/report.md
