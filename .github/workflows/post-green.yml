# Repo-owned: seeded once by the fleet sync, never overwritten by a later sync; the contract is the fleet's
# docs/all-green.md, "After the gate". The managed ci.yml calls this workflow on every green push to main with the
# judged sha; main runs are keyed by sha, so runs for neighbouring commits overlap and a job here may finish after
# a newer commit's did. Every job acts on the repository's current state, idempotently.
#
#   publish-next  -> the cli built at the judged commit, published to npm as X.Y.(Z+1)-main.<count>.<yyyymmdd>.g<sha7>
#                    under the next dist-tag through trusted publishing (OIDC, no registry token)
#
# Until the owner's one-time npm trusted-publisher setup for Vivswan/maxims exists, publish-next fails on npm publish;
# a rerun converges once it does, and a version the registry already holds is never republished. npm validates the
# CALLING workflow's filename for a workflow_call publish, so the trusted publisher for the package maxims names
# ci.yml, not this file.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  # No permissions key: a job asking above the caller's ceiling fails the whole call, so the OIDC grant arrives
  # by inheritance from the id-token: write the managed ci.yml gives the post-green call.
  # The npm-publish lane exists because ci.yml keys main runs by sha (two green pushes can publish at once) and
  # the registry has no compare-and-set: a verdict read under the lane still holds when its publish lands.
  #   no ACTIONS_ID_TOKEN_REQUEST_URL -> the caller granted none (a fork, a ceiling change); step one skips the rest
  #   shared lane                     -> update-release.yml's publish-npm takes the same lane; no caller holds it
  #   verdict compares the record     -> the lane serializes but does not order; GitHub promises no queue order
  #   confirm holds the lane          -> a job ends once the registry shows its publish, so the next holder's verdict sees it
  publish-next:
    if: github.repository == 'Vivswan/maxims'
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the caller grants an OIDC token
        id: oidc
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this run has no OIDC token (the post-green call in the managed ci.yml grants no id-token: write);" \
              "the pre-release was not published to npm." \
              "Add id-token: write to that call's permissions in Vivswan/repo-platform to publish every green push to @next."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.oidc.outputs.proceed == 'true'
        with:
          ref: ${{ inputs.sha }}
          # The version counts main's commits under this one and the verdict places published sources by ancestry; a shallow checkout can do neither.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.oidc.outputs.proceed == 'true'
        with:
          bun-version-file: .bun-version
      # registry-url writes the .npmrc npm publishes through; with no NODE_AUTH_TOKEN the action leaves a
      # placeholder there, which npm's OIDC exchange replaces.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.oidc.outputs.proceed == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (and its provenance) exists from npm 11.5.1 on; an older bundled npm is upgraded once,
      # then held to the floor.
      - name: Require an npm that publishes through OIDC
        if: steps.oidc.outputs.proceed == 'true'
        run: |
          floor=11.5.1
          below_floor() { [ "$(printf '%s\n' "$floor" "$(npm --version)" | sort -V | head -n1)" != "$floor" ]; }
          if below_floor; then
            npm install -g npm@latest
          fi
          if below_floor; then
            echo "::error::npm $(npm --version) cannot publish through OIDC; trusted publishing needs npm $floor or newer."
            exit 1
          fi
      - if: steps.oidc.outputs.proceed == 'true'
        run: bun install --frozen-lockfile
      # The verdict reads the registry's origin record (the CDN's copy lags a publish by up to 300 s) and places
      # every published pre-release by the ancestry of the source sha it names, so next never moves back on what
      # the run can see; a registry error stops the job instead of publishing blind.
      - name: Judge whether this commit's pre-release goes to npm
        id: verdict
        if: steps.oidc.outputs.proceed == 'true'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          verdict="$(GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts npm-verdict next)"
          case "$verdict" in
            publish\ *)
              echo "action=publish" >> "$GITHUB_OUTPUT"
              echo "version=${verdict#publish }" >> "$GITHUB_OUTPUT" ;;
            present\ *)
              echo "::notice::${verdict#present } is already on the registry; nothing published, next is confirmed below."
              echo "action=present" >> "$GITHUB_OUTPUT" ;;
            skip\ *)
              echo "::notice::${verdict#skip }"
              echo "action=skip" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "unexpected npm-verdict output: $verdict"
              echo "::error::npm-verdict printed none of publish, present, or skip; see the line above."
              exit 1 ;;
          esac
      # The bundle reads its version from package.json when it is built, so the manifest carries the pre-release
      # version before the build runs; a bundle built first would announce the last stable version under the new one.
      - name: Set package.json to the pre-release version
        if: steps.verdict.outputs.action == 'publish'
        env:
          VERSION: ${{ steps.verdict.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - name: Build the bundle
        if: steps.verdict.outputs.action == 'publish'
        run: bun run build
      # The postcondition the reorder above exists for, checked where it matters: the built bundle announces the
      # version npm is about to publish. A bundle built before the manifest carried it fails here, never on the registry.
      - name: Confirm the bundle announces the version being published
        if: steps.verdict.outputs.action == 'publish'
        env:
          VERSION: ${{ steps.verdict.outputs.version }}
        run: |
          announced="$(node dist/cli.js --version)"
          if [ "$announced" != "maxims $VERSION" ]; then
            echo "::error::dist/cli.js --version prints '$announced', not 'maxims $VERSION', the version about to be published; the bundle was built before package.json carried it."
            exit 1
          fi
      # npm's provenance names the commit in GITHUB_SHA, so the source is passed in.
      - name: Publish the pre-release under the next dist-tag
        if: steps.verdict.outputs.action == 'publish'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: GITHUB_SHA="$SOURCE_SHA" npm publish --tag next
      # npm makes a publish readable asynchronously. This step holds the lane until the record shows the version,
      # so the next holder's verdict sees it; a record that never shows it warns. It then fails the job when next
      # names neither this version nor a descendant's: OIDC authenticates npm publish alone, not npm dist-tag add,
      # so no tag is moved here; the next green push moves next forward, or a hand npm dist-tag add does, and a
      # rerun then confirms and passes.
      - name: Confirm the registry shows the publish and next moved forward
        if: steps.verdict.outputs.action == 'publish' || steps.verdict.outputs.action == 'present'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          confirmed="$(GITHUB_SHA="$SOURCE_SHA" bun .github/scripts/release-pipeline.ts npm-confirm next)"
          case "$confirmed" in
            settled\ *) echo "::notice::${confirmed#settled }" ;;
            unsettled\ *) echo "::warning::${confirmed#unsettled }" ;;
            behind\ *)
              echo "::error::${confirmed#behind }"
              exit 1 ;;
            *)
              echo "unexpected npm-confirm output: $confirmed"
              echo "::error::npm-confirm printed neither settled, unsettled, nor behind; see the line above."
              exit 1 ;;
          esac
