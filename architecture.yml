layers:
  cli: [src/cli.ts]
  commands: [src/commands/]
  harnesses: [src/harnesses/]
  rulefile: [src/rulefile/]
  sources: [src/sources/]
  state: [src/state/]
  memory: [src/memory/]
  util: [src/util/]
  version: [src/version.ts, package.json]

exclude:
  - "src/**/*.test.ts"
  - "src/**/fixtures/**"

# from -> the layers it may import; a layer absent here imports nothing outside itself.
edges:
  cli: [version]
  commands: [harnesses, util]
  harnesses: [memory, rulefile, util, version]
  rulefile: [memory, state, util]
  sources: [memory, state, util]
  state: [harnesses, memory, util, version]
  memory: [util]
  util: [state]
