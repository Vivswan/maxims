layers:
  cli: [src/cli.ts]
  commands: [src/commands/]
  engine: [src/engine/]
  console: [src/console/]
  harnesses: [src/harnesses/]
  rulefile: [src/rulefile/]
  sources: [src/sources/]
  state: [src/state/]
  contracts: [src/contracts/]
  memory: [src/memory/]
  util: [src/util/]
  version: [src/version.ts, package.json]

exclude:
  - "src/**/*.test.ts"
  - "src/**/fixtures/**"

# from -> the layers it may import; a layer absent here imports nothing outside itself.
edges:
  cli: [commands, console, engine, util]
  commands: [console, contracts, engine, harnesses, memory, rulefile, sources, state, util, version]
  engine: [console, contracts, harnesses, memory, rulefile, sources, state, util]
  console: [memory]
  harnesses: [contracts, rulefile, util, version]
  rulefile: [contracts, memory, state, util]
  sources: [contracts, memory, util]
  state: [contracts, memory, util, version]
  memory: [util]
  util: [contracts]
